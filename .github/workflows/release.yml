name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows x64 ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + Electron Windows x64)
        run: npx vite build && npx electron-builder --win --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: desktop/dist-electron/Foldiq Setup*.exe

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Rename for clean URLs
        run: |
          mv artifacts/windows/*.exe artifacts/windows/Foldiq-Setup.exe   2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Foldiq ${{ github.ref_name }}"
          files: |
            artifacts/windows/Foldiq-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
